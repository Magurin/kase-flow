[package]
name = "kase-flow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.3.0"
borsh = { version = "1.5.7", features = ["derive"] }
spl-token-2022 = { version = "8.0.1", features = ["no-entrypoint"] }
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }

[features]
custom-heap = []
custom-panic = []

[dev-dependencies]
litesvm = "0.16"
solana-account = "4"
solana-address = "2"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
spl-token-metadata-interface = "0.7"
